<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte Faker</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07060d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #1c1436 0%, var(--bg) 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; overflow:hidden; font-family:'Rajdhani',sans-serif; color:#f4e3b0;
    -webkit-tap-highlight-color:transparent; touch-action:none;
  }
  .scene { perspective: 1100px; }
  .card {
    --rx:0deg; --ry:0deg; --mx:50%; --my:50%; --o:0;
    width:min(82vw, 380px); aspect-ratio: 590 / 855;
    position:relative; border-radius:4.4% / 3%;
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transform-style: preserve-3d; transition: transform .12s ease-out;
    animation: aura 3s ease-in-out infinite;
  }
  @keyframes aura {
    0%,100% { box-shadow: 0 30px 60px -20px rgba(0,0,0,.9), 0 0 30px rgba(255,200,90,.25); }
    50%     { box-shadow: 0 30px 60px -20px rgba(0,0,0,.9), 0 0 60px rgba(255,190,80,.5), 0 0 110px rgba(160,90,255,.3); }
  }
  .layer { position:absolute; inset:0; border-radius:inherit; }
  .art { overflow:hidden; background:#05030d; }
  .art canvas { width:100%; height:100%; display:block; }
  .rays {
    position:absolute; left:45%; top:36%; width:240%; aspect-ratio:1;
    transform: translate(-50%,-50%); mix-blend-mode: screen;
    background: repeating-conic-gradient(from 0deg, rgba(255,215,130,.22) 0deg 3deg, transparent 3deg 11deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 18%, transparent 42%);
            mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.6) 18%, transparent 42%);
    animation: spin 50s linear infinite;
  }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  .halo {
    position:absolute; left:45%; top:34%; width:75%; aspect-ratio:1; transform:translate(-50%,-50%);
    background: radial-gradient(circle, rgba(255,226,150,.55) 0%, rgba(255,170,60,.25) 25%, rgba(150,60,255,.12) 45%, transparent 65%);
    mix-blend-mode: screen; animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity:.65; transform:translate(-50%,-50%) scale(1.08); } }
  .floor {
    position:absolute; left:0; right:0; bottom:0; height:40%;
    background: linear-gradient(to top, rgba(5,3,13,.95) 0%, rgba(5,3,13,.55) 35%, transparent 100%);
  }
  .holo {
    pointer-events:none;
    background: repeating-linear-gradient(115deg,
      rgba(255,0,128,0) 0%, rgba(255,0,128,.32) 6%, rgba(255,200,0,.32) 12%,
      rgba(0,255,170,.32) 18%, rgba(0,160,255,.32) 24%, rgba(170,0,255,.32) 30%, rgba(255,0,128,0) 36%);
    background-size: 300% 300%; background-position: var(--mx) var(--my);
    mix-blend-mode: color-dodge; opacity: calc(.25 + var(--o) * .4);
    transform: translateZ(1px);
  }
  .player-clip {
    position:absolute; left:0; right:0; top:0; bottom:17.2%;
    clip-path: inset(-50% -20% 0 -20%); transform: translateZ(45px); pointer-events:none;
  }
  .player {
    position:absolute; bottom:0; left:13%; width:72%;
    filter: drop-shadow(0 0 12px rgba(255,210,120,.55)) drop-shadow(0 6px 10px rgba(0,0,0,.6));
    -webkit-mask-image: linear-gradient(to bottom,#000 80%,transparent 100%), linear-gradient(to left,transparent 0%,#000 9%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to bottom,#000 80%,transparent 100%), linear-gradient(to left,transparent 0%,#000 9%);
    mask-composite: intersect;
  }
  svg.frame { position:absolute; inset:0; width:100%; height:100%; transform: translateZ(20px); pointer-events:none; overflow:visible; }
  .sheen { animation: sweep 4.5s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-900px); } 60%,100% { transform: translateX(900px); } }
  .plate { position:absolute; left:0; right:0; top:83.4%; text-align:center; transform: translateZ(30px); pointer-events:none; }
  .name {
    font-family:'Cinzel',serif; font-weight:900; letter-spacing:.2em; padding-left:.2em;
    font-size: clamp(20px, 6.8vw, 31px); line-height:1;
    background: linear-gradient(180deg,#fffbe8 0%,#f7d77a 45%,#c08a25 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.85)) drop-shadow(0 0 8px rgba(255,200,90,.55));
  }
  .sub {
    margin-top:2px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    font-size: clamp(7.5px, 2.2vw, 10px); color:#ffe6a0; text-shadow: 0 1px 2px #000;
  }
  .rarity {
    position:absolute; top:9.2%; right:10.5%; transform: translateZ(35px);
    font-weight:700; font-size: clamp(8px,2.2vw,10px); letter-spacing:.2em;
    padding:3px 8px; border-radius:20px; color:#1a1000;
    background: linear-gradient(90deg,#ffe58a,#ffb347,#ff7ad9,#8ab4ff,#7dffd0,#ffe58a);
    background-size:300% 100%; animation: slide 4s linear infinite;
    box-shadow:0 0 10px rgba(255,220,120,.7);
  }
  @keyframes slide { to { background-position:300% 0; } }
  .glare {
    pointer-events:none;
    background: radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.5) 0%, rgba(255,255,255,.1) 22%, transparent 50%);
    mix-blend-mode: overlay; opacity: calc(.45 + var(--o) * .5); transform: translateZ(60px);
  }
  .sparks { pointer-events:none; transform: translateZ(70px); }
  .spark {
    position:absolute; width:4px; height:4px; border-radius:50%;
    background:#fff3c4; box-shadow:0 0 6px 2px rgba(255,215,120,.9);
    animation: twinkle var(--d) ease-in-out infinite; animation-delay: var(--delay); opacity:0;
  }
  @keyframes twinkle {
    0% { opacity:0; transform: translateY(0) scale(.4); }
    40% { opacity:1; transform: translateY(-14px) scale(1); }
    100% { opacity:0; transform: translateY(-34px) scale(.3); }
  }
  .stamps { position:absolute; left:9.5%; right:9.5%; top:76.4%; display:flex; justify-content:space-between; align-items:center; transform: translateZ(40px); pointer-events:none; }
  .ed-stamp { font-family:'Cinzel',serif; font-weight:900; font-size:clamp(7px,2vw,9.5px); letter-spacing:.12em; color:#f7d77a; padding:3px 6px; border:1.5px solid #f7d77a; border-radius:3px; background:rgba(10,6,22,.75); box-shadow:0 0 8px rgba(0,0,0,.6); }
  .set-stamp { display:flex; align-items:center; gap:5px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:clamp(8px,2.3vw,11px); letter-spacing:.06em; color:#f7d77a; padding:2px 7px 2px 4px; border-radius:20px; background:rgba(10,6,22,.75); border:1px solid rgba(247,215,122,.5); }
  .set-stamp svg { width:13px; height:13px; }
  .hint { font-size:13px; letter-spacing:.15em; opacity:.55; text-transform:uppercase; }
  @media (prefers-reduced-motion: reduce) { .card,.spark,.rarity,.rays,.halo,.sheen { animation:none; } }
</style>
</head>

<script>
  // --- Fond cosmique généré (graine fixe = même fond à chaque fois) ---
  function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  (function drawSpace(){
    const c=document.getElementById('space'), x=c.getContext('2d'), W=c.width, H=c.height, R=rng(2024);
    const g=x.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#120830'); g.addColorStop(.5,'#0a0520'); g.addColorStop(1,'#04020a');
    x.fillStyle=g; x.fillRect(0,0,W,H);
    x.globalCompositeOperation='lighter';
    const cols=[[123,44,255],[255,43,214],[47,107,255],[255,184,77],[0,200,255],[160,60,255]];
    for(let i=0;i<70;i++){
      const cx=W*(.1+R()*.8), cy=H*(.05+R()*.7), r=W*(.12+R()*.35), col=cols[Math.floor(R()*cols.length)], a=.04+R()*.08;
      const rg=x.createRadialGradient(cx,cy,0,cx,cy,r);
      rg.addColorStop(0,`rgba(${col},${a})`); rg.addColorStop(.5,`rgba(${col},${a*.4})`); rg.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=rg; x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fill();
    }
    // traînée de galaxie en diagonale
    for(let i=0;i<260;i++){
      const t=R(), cx=W*(-.05+t*1.1)+ (R()-.5)*W*.18, cy=H*(.62-t*.5)+(R()-.5)*H*.1, r=W*(.02+R()*.06);
      const col=R()<.5?[255,200,120]:[200,140,255], a=.03+R()*.05;
      const rg=x.createRadialGradient(cx,cy,0,cx,cy,r);
      rg.addColorStop(0,`rgba(${col},${a})`); rg.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=rg; x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fill();
    }
    // étoiles
    for(let i=0;i<900;i++){
      const sx=R()*W, sy=R()*H, s=R()**3*2.6+.4, a=.35+R()*.65;
      x.fillStyle=`rgba(255,${230+R()*25|0},${200+R()*55|0},${a})`;
      x.beginPath(); x.arc(sx,sy,s,0,Math.PI*2); x.fill();
    }
    // étoiles brillantes en croix
    for(let i=0;i<26;i++){
      const sx=R()*W, sy=R()*H*.85, L=10+R()*26;
      const rg=x.createRadialGradient(sx,sy,0,sx,sy,L*1.4);
      rg.addColorStop(0,'rgba(255,240,200,.9)'); rg.addColorStop(.15,'rgba(255,210,140,.35)'); rg.addColorStop(1,'rgba(0,0,0,0)');
      x.fillStyle=rg; x.beginPath(); x.arc(sx,sy,L*1.4,0,Math.PI*2); x.fill();
      x.strokeStyle='rgba(255,240,210,.7)'; x.lineWidth=1.2;
      x.beginPath(); x.moveTo(sx-L,sy); x.lineTo(sx+L,sy); x.moveTo(sx,sy-L); x.lineTo(sx,sy+L); x.stroke();
    }
    // grille hexagonale e-sport très légère
    x.globalCompositeOperation='source-over';
    x.strokeStyle='rgba(180,150,255,.07)'; x.lineWidth=1.5;
    const hs=34, hw=Math.sqrt(3)*hs;
    for(let row=-1; row*hs*1.5<H+hs; row++){
      for(let col=-1; col*hw<W+hw; col++){
        const hx=col*hw+(row%2?hw/2:0), hy=row*hs*1.5;
        x.beginPath();
        for(let k=0;k<6;k++){ const an=Math.PI/3*k+Math.PI/6; x.lineTo(hx+hs*Math.cos(an), hy+hs*Math.sin(an)); }
        x.closePath(); x.stroke();
      }
    }
  })();

  // --- Étincelles ---
  const card=document.getElementById('card'), sparks=document.getElementById('sparks');
  for(let i=0;i<22;i++){
    const s=document.createElement('div'); s.className='spark';
    s.style.left=(6+Math.random()*88)+'%'; s.style.top=(8+Math.random()*76)+'%';
    s.style.setProperty('--d',(2+Math.random()*2.5)+'s'); s.style.setProperty('--delay',(-Math.random()*4)+'s');
    sparks.appendChild(s);
  }
  // --- Inclinaison 3D ---
  let active=false, t0=performance.now();
  function setTilt(px,py,o){
    card.style.setProperty('--ry',((px-.5)*30)+'deg'); card.style.setProperty('--rx',((.5-py)*30)+'deg');
    card.style.setProperty('--mx',(px*100)+'%'); card.style.setProperty('--my',(py*100)+'%'); card.style.setProperty('--o',o);
  }
  function fromEvent(e){
    const p=e.touches?e.touches[0]:e, r=card.getBoundingClientRect();
    active=true; setTilt(Math.min(1,Math.max(0,(p.clientX-r.left)/r.width)), Math.min(1,Math.max(0,(p.clientY-r.top)/r.height)), 1);
  }
  ['mousemove','touchstart','touchmove'].forEach(ev=>window.addEventListener(ev,fromEvent,{passive:true}));
  ['mouseleave','touchend','touchcancel'].forEach(ev=>window.addEventListener(ev,()=>{active=false;t0=performance.now();}));
  (function idle(now){
    if(!active){ const t=(now-t0)/1000; setTilt(.5+Math.sin(t*.9)*.28,.5+Math.cos(t*.7)*.2,.4); }
    requestAnimationFrame(idle);
  })(performance.now());
</script>
</body>
</html>
