<style>
  /* Modèle des cartes COMMUNES — même DA pour les 50 : sobre, mat, aucun effet */
  :root {
    --bg: #0b0a14;
    --edge: #2a2833;          /* bordure graphite */
    --edge-hi: #4a4756;
    --face: #e9e7ee;          /* fond clair de la carte */
    --ink: #17161d;
    --ink-soft: #5d5a68;
    --rarity: #8f8b9e;        /* gris commune */
    --f-display: 'Oxanium', 'Segoe UI', sans-serif;
    --f-body: 'Barlow', 'Segoe UI', sans-serif;
    --f-mono: 'JetBrains Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: var(--f-body); }

  .card {
    width: min(86vw, 360px); aspect-ratio: 63 / 88; container-type: inline-size;
    border-radius: 4.5cqw; padding: 3.2cqw; position: relative;
    background: linear-gradient(160deg, var(--edge-hi), var(--edge) 40%, #1c1a23);
    box-shadow: 0 24px 40px -18px rgba(0,0,0,.8);
  }
  .inner {
    height: 100%; border-radius: 2.6cqw; background: var(--face);
    display: grid; grid-template-rows: auto 1fr auto auto auto; gap: 2.4cqw; padding: 3.2cqw;
    box-shadow: inset 0 0 0 0.5cqw rgba(255,255,255,.6);
  }

  /* En-tête : nom + rareté */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 3cqw; }
  .name { font-family: var(--f-display); font-weight: 800; font-size: 8.4cqw; line-height: 1; color: var(--ink); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rar { flex: none; width: 4.6cqw; height: 4.6cqw; border-radius: 50%; background: var(--rarity); box-shadow: inset 0 0 0 0.6cqw rgba(255,255,255,.35); }

  /* Fenêtre d'illustration */
  .art {
    border-radius: 2cqw; position: relative; overflow: hidden; display: grid; place-items: center;
    background:
      repeating-linear-gradient(135deg, rgba(23,22,29,.035) 0 2cqw, transparent 2cqw 4cqw),
      radial-gradient(circle at 50% 45%, #ffffff, #d9d6e0 75%);
    box-shadow: inset 0 0 0 0.5cqw #c9c6d2, inset 0 1.2cqw 2.4cqw rgba(0,0,0,.08);
  }
  .art img { width: 70%; height: 80%; object-fit: contain; filter: drop-shadow(0 1.2cqw 1.4cqw rgba(0,0,0,.18)); }

  /* Bandeau type */
  .type {
    display: flex; justify-content: space-between; align-items: center; gap: 2cqw;
    padding: 1.4cqw 2.6cqw; border-radius: 1.4cqw; background: var(--ink); color: #eeeaf6;
    font-family: var(--f-display); font-weight: 600; font-size: 3.3cqw; letter-spacing: .12em; text-transform: uppercase;
  }
  .type span:last-child { color: #b7b3c4; }

  /* Texte */
  .text { font-size: 4.2cqw; line-height: 1.3; color: var(--ink); min-height: 11cqw; }
  .text small { display: block; color: var(--ink-soft); font-size: 3.4cqw; margin-top: .6cqw; }

  /* Pied : stamp édition + symbole/numéro */
  .foot { display: flex; align-items: center; justify-content: space-between; padding-top: 2cqw; border-top: 0.3cqw solid #cfccd8; }
  .ed { font-family: var(--f-display); font-weight: 800; font-size: 2.8cqw; letter-spacing: .1em; color: var(--ink); padding: .7cqw 1.4cqw; border: 0.4cqw solid var(--ink); border-radius: .8cqw; }
  .set { display: flex; align-items: center; gap: 1.4cqw; font-family: var(--f-mono); font-size: 3.4cqw; color: var(--ink); font-variant-numeric: tabular-nums; }
  .set svg { width: 4.4cqw; height: 4.4cqw; }
  .set .r { width: 2.4cqw; height: 2.4cqw; border-radius: 50%; background: var(--rarity); }
</style>
</head>
